name: Release Charts

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  release:
    # depending on default permission settings for your org (contents being read-only or read-write for workloads), you will have to add permissions
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: write # to create GitHub Releases and push index.yaml to gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.12.3

      - name: Install chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          install_only: true

      # The OCI registries are bypassed since helm repo subcommands are not supported.
      # More details in https://helm.sh/docs/topics/registries/
      - name: Add dependency repositories via Helm (bypassing OCI repositories)
        run: |
          for dir in $(ls -d charts/*/); do
            helm dependency list $dir 2> /dev/null | tail +2 | head -n -1 | sed '/oci:\/\//d' | awk '{ print "helm repo add " $1 " " $3 }' | while read cmd; do $cmd; done
          done

      # helm/chart-releaser-action publishes the GitHub release before uploading
      # assets, which fails when immutable releases are enabled. Draft, attach
      # the chart package, then publish, and only then update gh-pages.
      - name: Publish charts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/release-charts.sh

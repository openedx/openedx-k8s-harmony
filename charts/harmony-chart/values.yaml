# Default values for tutor-multi-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

clusterDomain: null

# Email address used for receiving Let's encrypt notifications if cert-manager
# is enabled.
notificationEmail: null

traefik:
  # Enable the traefik ingress controller
  enabled: true
  ingressClass:
    isDefaultClass: true
    name: "traefik"
  providers:
    kubernetesIngressNGINX:
      enabled: true
      ingressClassByName: true


cert-manager:
  # Use cert-manager as a default certificate controller.
  enabled: true
  installCRDs: false

clusterIssuer:
  # Whether to create the harmony-letsencrypt-global ClusterIssuer.
  enabled: true
  # Custom ingress class used by the Let's Encrypt HTTP01 solver.
  ingressClass: ""

# Configuration for the metrics server chart
metricsserver:
   # Control the chart inclusion
   enabled: false
   # See https://github.com/kubernetes-sigs/metrics-server/blob/master/charts/metrics-server/values.yaml
   # for all available options
   replicas: 1

# Configuration for the Vertical Pod Autoscaler chart
vpa:
   # Control the chart inclusion
   enabled: false
   # See https://github.com/cowboysysop/charts/blob/master/charts/vertical-pod-autoscaler/values.yaml
   # for all available options
   admissionController:
      replicaCount: 1

# Multi-tenant ElasticSearch
elasticsearch:
  enabled: false

  clusterName: "harmony-search-cluster"
  masterService: "harmony-search-cluster"

  # Operators will need to add/update the following setting in each
  # of their instances by running the commands:
  # ```
  # tutor config save --set K8S_HARMONY_ENABLE_SHARED_HARMONY_SEARCH=true --set RUN_ELASTICSEARCH=false
  # tutor harmony create-elasticsearch-user
  # ```
  # RUN_ELASTICSEARCH: false
  # K8S_HARMONY_ENABLE_SHARED_HARMONY_SEARCH: true

  # We will create the relevant certs, because they need to shared
  # with pods in other namespaces.
  createCert: false
  # Authentication is only available in https
  protocol: https

  # This secret will contain the http certificates.
  secretMounts:
    - name: elasticsearch-certificates
      secretName: search-cluster-certificates-elasticsearch
      path: /usr/share/elasticsearch/config/certs
      defaultMode: 0777

  # The password for the elastic user is stored in this secret
  extraEnvs:
    - name: ELASTIC_PASSWORD
      valueFrom:
        secretKeyRef:
          name: elasticsearch-credentials
          key: password

  esConfig:
    "elasticsearch.yml": |
      cluster.name: harmony-search-cluster
      xpack.security.enabled: true
      xpack.security.http.ssl.enabled: true
      xpack.security.http.ssl.key: /usr/share/elasticsearch/config/certs/tls.key
      xpack.security.http.ssl.certificate: /usr/share/elasticsearch/config/certs/chain.crt
      xpack.security.transport.ssl.enabled: true
      xpack.security.transport.ssl.key: /usr/share/elasticsearch/config/certs/tls.key
      xpack.security.transport.ssl.certificate: /usr/share/elasticsearch/config/certs/tls.crt
      xpack.security.transport.ssl.certificate_authorities: /usr/share/elasticsearch/config/certs/ca.crt
      xpack.security.transport.ssl.verification_mode: certificate

# Multi-tenant OpenSearch
opensearch:
  enabled: false
  clusterName: "harmony-search-cluster"
  masterService: "harmony-search-cluster"

  # Operators will need to add/update the following setting in each
  # of their instances by running the commands:
  # ```
  # tutor config save --set K8S_HARMONY_ENABLE_SHARED_HARMONY_SEARCH=true --set RUN_ELASTICSEARCH=false
  # tutor harmony create-opensearch-user
  # ```
  # RUN_ELASTICSEARCH: false
  # K8S_HARMONY_USE_SHARED_OPENSEARCH: true

  # # This secret will contain the ssl certificates.
  secretMounts:
    - name: opensearch-certificates
      secretName: search-cluster-certificates-elasticsearch
      path: /usr/share/opensearch/config/certs
      defaultMode: 0777

  resources:
    requests:
      cpu: "1000m"
      memory: "100Mi"

  persistence:
    size: 30Gi

  # Set vm.max_map_count
  # Default value is 262144
  sysctlInit:
    enabled: true

  extraEnvs:
    - name: DISABLE_INSTALL_DEMO_CONFIG
      value: "true"

  # Allows you to add any config files in {{ .Values.opensearchHome }}/config
  opensearchHome: /usr/share/opensearch
  # such as opensearch.yml and log4j2.properties

  securityConfig:
    enabled: true
    internalUsersSecret: opensearch-credentials

  config:
    opensearch.yml: |
      cluster.name: harmony-search-cluster
      network.host: 0.0.0.0
      plugins:
        security:
          ssl:
            transport:
              enabled: true
              pemcert_filepath: certs/tls.crt
              pemkey_filepath: certs/tls.key
              pemtrustedcas_filepath: certs/ca.crt
              enforce_hostname_verification: false
            http:
              enabled: true
              pemcert_filepath: certs/tls.crt
              pemkey_filepath: certs/tls.key
              pemtrustedcas_filepath: certs/ca.crt
          authcz:
            admin_dn:
              - CN=opensearch-master.*.local
          nodes_dn:
            - CN=opensearch-master.*.local
          allow_unsafe_democertificates: false
          allow_default_init_securityindex: true
          audit.type: internal_opensearch
          enable_snapshot_restore_privilege: true
          check_snapshot_restore_write_privileges: true
          restapi:
            roles_enabled: ["all_access", "security_rest_api_access"]
          system_indices:
            enabled: true
            indices:
              [
                ".opendistro-alerting-config",
                ".opendistro-alerting-alert*",
                ".opendistro-anomaly-results*",
                ".opendistro-anomaly-detector*",
                ".opendistro-anomaly-checkpoints",
                ".opendistro-anomaly-detection-state",
                ".opendistro-reports-*",
                ".opendistro-notifications-*",
                ".opendistro-notebooks",
                ".opendistro-asynchronous-search-response*",
              ]

# Configuration for the Karpenter chart
karpenter:
  enabled: false

  # -- IMPORTANT: Karpenter ships its CRDs in a separate chart (`karpenter-crd`)
  # since v1.0. This dependency does NOT install them, and Helm never upgrades
  # CRDs on its own. Install and upgrade `karpenter-crd` on the cluster before
  # enabling this block, or the NodePool/EC2NodeClass resources below will fail
  # to apply.

  serviceAccount:
    name: "karpenter"
    annotations:
      eks.amazonaws.com/role-arn: ""
  # NOTE: these keys are read by the Karpenter subchart itself, and they are flat
  # since Karpenter v0.32. The old `settings.aws.*` block was removed upstream.
  settings:
    # -- Cluster name.
    clusterName: ""
    # -- Cluster endpoint. If not set, will be discovered during startup (EKS only)
    # clusterEndpoint: ""
    # -- interruptionQueue is the name of the SQS queue used for processing
    # interruption events from EC2. Interruption handling is disabled if not
    # specified. Enabling it may require additional permissions on the
    # controller service account.
    interruptionQueue: ""

  # -- Keep the controller itself off the nodes it manages: pin it to the
  # managed node group and tolerate the taint that group carries.
  nodeSelector: {}
  # nodeSelector:
  #   karpenter.sh/controller: "true"
  tolerations: []
  # tolerations:
  #   - key: CriticalAddonsOnly
  #     operator: Exists
  # ---------------------------------------------------------------------------
  # Resources rendered by this chart
  # ---------------------------------------------------------------------------

  # -- Value of the `karpenter.sh/discovery` tag used to discover subnets and
  # security groups, and applied to every instance Karpenter launches. Defaults
  # to `settings.clusterName` when empty.
  discovery: ""

  # -- Availability zones the NodePools are restricted to. Rendered as a
  # `topology.kubernetes.io/zone` requirement and appended to every NodePool
  # that does not declare that key itself. Leave empty to let Karpenter pick
  # from every zone the discovered subnets cover.
  zones: []
  # zones: ["us-east-1a", "us-east-1b", "us-east-1c"]

  # -- Name of the EC2NodeClass used by NodePools that do not set their own
  # `nodeClassRef`. Must match a key under `ec2NodeClasses`.
  defaultEC2NodeClass: ""

  # EC2NodeClass describes how nodes are launched: AMI, IAM identity, subnets,
  # security groups, disks and userData. It replaces the removed AWSNodeTemplate
  # (karpenter.k8s.aws/v1alpha1).
  # More details in https://karpenter.sh/docs/concepts/nodeclasses/
  #
  # Keyed by resource name. `spec` is passed through to the CR verbatim, so any
  # field the EC2NodeClass API accepts — now or in a future version — can be set
  # here without changing the chart. `subnetSelectorTerms`,
  # `securityGroupSelectorTerms` and `tags` default to the `discovery` tag when
  # omitted. Set `enabled: false` on an entry to drop it.
  ec2NodeClasses: {}
  # ec2NodeClasses:
  #   ubuntu-gp:
  #     spec:
  #       # -- Exactly one of `role` or `instanceProfile` is required by the API.
  #       # Karpenter v1 removed the cluster-wide
  #       # `settings.aws.defaultInstanceProfile`, so identity lives here.
  #       role: "my-eks-node-group-role"
  #       # instanceProfile: ""
  #       # -- Mandatory since Karpenter v1: there is no implicit default AMI.
  #       # An alias tracks the latest AMI AWS publishes for that family;
  #       # alternatively select by `id`, `name`, `owner`, `ssmParameter` or `tags`.
  #       amiFamily: AL2
  #       amiSelectorTerms:
  #         - id: "ami-0123456789abcdef0"
  #       blockDeviceMappings:
  #         - deviceName: "/dev/sda1"
  #           rootVolume: true
  #           ebs:
  #             volumeType: gp3
  #             volumeSize: 50Gi
  #             encrypted: true
  #       # -- Extra tags stamped on every instance this class launches.
  #       # Unlike the selector terms above, `tags` is passed through
  #       # untouched: add the discovery tag here yourself if you want the
  #       # instances labelled with it too.
  #       tags:
  #         karpenter.sh/discovery: "my-cluster"
  #       # -- Node bootstrap script. Never commit registry credentials or any
  #       # other secret here: this file ships inside a public chart. Inject them
  #       # from your own overlay or secret store instead.
  #       # userData: ""

  # NodePool describes the nodes to provision and when to disrupt them. It
  # replaces the removed Provisioner (karpenter.sh/v1alpha5).
  # More details in https://karpenter.sh/docs/concepts/nodepools/

  nodePools: {}
  # nodePools:
  #   default:
  #     spec:
  #       template:
  #         spec:
  #           # -- Constrains what Karpenter may launch. Intersected with
  #           # whatever the pending pod already requires, so keep it broad
  #           # enough to leave the scheduler room.
  #           requirements:
  #             - key: kubernetes.io/arch
  #               operator: In
  #               values: ["amd64"]
  #             - key: karpenter.sh/capacity-type
  #               operator: In
  #               values: ["on-demand"]
  #           # -- Taint the nodes so only pods that tolerate it land here.
  #           # taints:
  #           #   - key: example.com/dedicated
  #           #     value: "true"
  #           #     effect: NoSchedule
  #           # -- How long a node may live before it is replaced. Defaults to
  #           # 720h; use "Never" to disable expiration.
  #           # expireAfter: 720h
  #       # -- Ceiling for the pool as a whole, not per node.
  #       # More details in https://karpenter.sh/docs/concepts/nodepools/#speclimits
  #       limits:
  #         cpu: 200
  #         memory: 800Gi
  #       disruption:
  #         # -- WhenEmptyOrUnderutilized also consolidates nodes that are still
  #         # running workloads; WhenEmpty only reclaims empty ones.
  #         consolidationPolicy: WhenEmptyOrUnderutilized
  #         # -- How long a node must meet the policy before being disrupted.
  #         consolidateAfter: 5m
  #         # -- Cap how much of the pool may be disrupted at once.
  #         budgets:
  #           - nodes: "10%"
  #       # -- Higher weight wins when more than one pool can satisfy a pod.
  #       # weight: 100

# Prometheus stack
#
# If no storage is defined, the Prometheus and Grafana data is stored on
# empheral storage. You can find more information about storages in the
# Prometheus operator user guides: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/user-guides/storage.md
#
# - To make Grafana persistent, you may want to set Grafana storage as shown in https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml#L999-L1009
# - To set Prometheus storage, you can see the example storage spec at https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml#L3557-L3570
prometheusstack:
  enabled: false

  kubeStateMetrics:
    enabled: true

  nodeExporter:
    enabled: true

  prometheus:
    enabled: true

    prometheusSpec:
      resources:
        requests:
          cpu: "200m"
          memory: "450Mi"

  alertmanager:
    enabled: true

    alertmanagerSpec:
      resources:
        requests:
          cpu: "100m"
          memory: "50Mi"

  # Admin password is not pre-generated, because it is not picked up by the
  # grafana pod yet -- this is a bug on their end. For more information, visit:
  # https://github.com/prometheus-community/helm-charts/issues/3679
  grafana:
    enabled: false

    ingress:
      enabled: false

    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: 'default'
            orgId: 1
            folder: ''
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default

    dashboards:
      default:
        kubernetes-views-global:
          # url: https://grafana.com/api/dashboards/15757/revisions/31/download
          gnetId: 15757
          revision: 31
          datasource: Prometheus

    grafana.ini:
      dashboards:
        default_home_dashboard_path: /var/lib/grafana/dashboards/default/kubernetes-views-global.json

    resources:
      requests:
        cpu: 200m
        memory: 256Mi

# Configuration for headlamp
headlamp:
  enabled: false

# The Velero subchart upgrades its CRDs (upgradeCRDs defaults to true).
velero:
  enabled: false

  # For the list of supported providers, and their configuration,
  # please visit https://velero.io/docs/main/supported-providers/
  configuration:
    backupStorageLocation:
      - name: "velero-backup-harmony"
        provider: aws
        bucket: ""  # unique name of the bucket
        default: true
        config:
          s3Url: "" # the endpoint can be any S3 compatible storage
          region: "" # the region of the bucket
          # Non-AWS S3 (DigitalOcean Spaces, UpCloud, and other S3-compatible
          # stores) must set checksumAlgorithm to "". The AWS plugin defaults
          # to CRC32, which those stores reject. Leave it unset for Amazon S3.

    volumeSnapshotLocation:
      - name: "velero-volume-snapshot-harmony"
        provider: "" # provider configuration
        config:
          region: "" # the region of the bucket

  credentials:
    secretContents:
      cloud: |
        [default]
        aws_access_key_id=""     # AWS access key ID
        aws_secret_access_key="" # AWS secret access key

  initContainers:
    - name: velero-plugin-for-aws
      image: velero/velero-plugin-for-aws:v1.14.4
      volumeMounts:
        - mountPath: /target
          name: plugins

  schedules:
    hourly-backup:
      disabled: false
      schedule: "30 */1 * * *"
      template:
        ttl: "24h"
    daily-backup:
      disabled: false
      schedule: "0 6 * * *"
      template:
        ttl: "168h"
    weekly-backup:
      disabled: false
      schedule: "59 23 * * 0"
      template:
        ttl: "720h"

vector:
  enabled: false
  role: "Agent"
  podDisruptionBudget: # Optional, but recommended
    enabled: true
    minAvailable: 1
  # Configures a PodMonitor CRD used by the Prometheus operator
  podMonitor:
    enabled: false
  tolerations:
  - operator: Exists
  logLevel: "info"
  customConfig:
    data_dir: /vector-data-dir
    api:
      enabled: false
      address: 0.0.0.0:8686

    sources:
      kubernetes_tutor_logs:
        type: kubernetes_logs
        extra_namespace_label_selector: app.kubernetes.io/managed-by=tutor
      kubernetes_global_logs:
        type: kubernetes_logs
        extra_namespace_label_selector: app.kubernetes.io/managed-by!=tutor

    transforms:

      # Filter out application and global logs whose message is empty to prevent Vector process crash when sending logs to Cloudwatch
      # More details in https://github.com/vectordotdev/vector/issues/15539
      openedx_logs:
        type: remap
        inputs:
        - kubernetes_tutor_logs
        source: |-
          if !includes(["lms", "cms", "cms-worker", "lms-worker", "lms-job", "cms-job"], .kubernetes.pod_labels."app.kubernetes.io/name"){
            abort
          }
          if contains(string!(.message), "[tracking]") {
            abort
          }
          .type = "application"
        drop_on_abort: true
        drop_on_error: true

      # Group multiline logs for better observabitlity
      grouped_openedx_logs:
        type: reduce
        merge_strategies:
          message: concat_newline
        inputs:
          - openedx_logs
        starts_when:
          type: "vrl"
          source: |-
            match(string!(.message), r'^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}.*')
      operation_openedx_logs:
        type: remap
        inputs:
        - kubernetes_tutor_logs
        source: |-
          if includes(["lms", "cms", "cms-worker", "lms-worker", "lms-job", "cms-job"], .kubernetes.pod_labels."app.kubernetes.io/name"){
            abort
          }
          .type = "application"
        drop_on_abort: true
        drop_on_error: true
      global_logs:
        type: filter
        inputs:
          - kubernetes_global_logs
        condition: 'includes(["traefik"], .kubernetes.pod_labels."app.kubernetes.io/name")'
      typed_global_logs:
        type: remap
        inputs:
        - global_logs
        source: |-
          .type = "global"
        drop_on_error: true
        drop_on_abort: true
      # Appplication logs (OpenedX, traefik, cert-manager) can be send to cloudwatch
      # or to s3. It will depend on user needs.
      application_logs:
        type: remap
        inputs:
        - grouped_openedx_logs
        - operation_openedx_logs
        - typed_global_logs
        source: |-
          if is_empty(string!(.message)) {
            log("Events with empty message are discarded", level: "info")
            abort
          }
      # Extract tracking logs from Open edX applications
      tracking_logs:
        type: remap
        inputs:
        - kubernetes_tutor_logs
        source: |-
          parsed, err_regex = parse_regex(.message, r'^.* \[tracking\] [^{}]* (?P<tracking_message>\{.*\})$')
          if err_regex != null {
            abort
          }
          message = parsed.tracking_message
          parsed_json, err_json = parse_json(parsed.tracking_message)
          if err_json != null {
            log("Unable to parse JSON from tracking log message: " + err_json, level: "info")
            abort
          }
          time, err_timestamp = parse_timestamp(parsed_json.time, "%+")
          if err_timestamp != null {
            log("Unable to parse timestamp from tracking log message: " + err_timestamp, level: "info")
            abort
          }
          .time = time
          .message = message
          .type = "tracking"

    # Make sure to check out values-example.yml to now how to sink logs to S3, CloudWatch and other services
    sinks: {}
